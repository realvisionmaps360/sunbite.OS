<!doctype html>
<html lang="de-CH">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#5c0d0c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Tela virada para o cliente, presa na food bike: nao pode aparecer a
         barra do Safari nem o iPad dormir no meio da feira. O "standalone" so
         vale depois de adicionar a tela de inicio. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- ⚠️ `black-translucent`, e a historia de por que ele voltou.
         Em 04/09 troquei para `black` achando que a barra translucida era a
         causa da listra vermelha do rodape. **Nao era**, e a troca criou um
         defeito pior: opaca, o iOS RESERVA uma faixa no topo para o relogio e
         a bateria em vez de deixar a pagina passar por baixo — e o Felipe
         fotografou uma faixa vermelha atravessada em cima da tela do cliente.
         Translucida, a pagina ocupa a tela inteira e o relogio fica por cima
         do conteudo, que e o certo para quiosque.
         O buraco que a translucida abria embaixo hoje esta tapado pelo piso de
         altura da raiz (`min-height` em vh/dvh) — ver `Display.tsx`.
         ⚠️ Esta meta e lida no momento em que o icone e criado: mudar aqui so
         vale depois de REMOVER e ADICIONAR o icone de novo no iPad. Foi
         exatamente por isso que o defeito so apareceu quando ele recriou o
         icone, uma rodada depois da mudanca. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- O nome que aparece embaixo do icone na Tela de Inicio do iPad.
         Sem isto o iOS usa o <title>, que e "Sunbite" nos dois — e no meio
         de duas telas parecidas, um rotulo igual e a receita para abrir a
         errada. "Sunbite Kunde" deixa claro, so de olhar, qual e qual. -->
    <meta name="apple-mobile-web-app-title" content="Sunbite Kunde" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Sunbite Kunde</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/display/main.tsx"></script>
  </body>
</html>
